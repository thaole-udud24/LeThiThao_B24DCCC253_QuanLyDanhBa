services:
  builder:
    build:
      context: .
      target: build
    volumes:
      - gradle-cache:/root/.gradle
      - ./output:/output
    command: sh -c "cp app/build/outputs/apk/debug/app-debug.apk /output/"

  test:
    profiles: ["test"]
    build:
      context: .
      target: build
    volumes:
      - gradle-cache:/root/.gradle
    command: gradle testDebugUnitTest --no-daemon

volumes:
  gradle-cache:
